<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>BlockWar - 游戏介绍</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1920px;
      height: 1080px;
      background: #f7f7f2;
      color: #171b22;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      display: flex;
      padding: 100px 120px;
      overflow: hidden;
      position: relative;
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      background-image:
        linear-gradient(rgba(221, 171, 40, 0.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(221, 171, 40, 0.2) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      gap: 80px;
    }

    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section-label {
      font-size: 24px;
      color: #ddab28;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 40px;
      border-left: 6px solid #ddab28;
      padding-left: 24px;
    }

    h2 {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 50px;
      text-shadow: 3px 3px 0 rgba(23, 27, 34, 0.08);
    }

    h2 .highlight {
      color: #ddab28;
    }

    .description {
      font-size: 32px;
      line-height: 1.8;
      color: #2d3440;
      margin-bottom: 60px;
    }

    .features {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 28px;
      color: #171b22;
    }

    .feature-icon {
      width: 48px;
      height: 48px;
      background: #ddab28;
      border: 3px solid #171b22;
      box-shadow: 4px 4px 0 rgba(23, 27, 34, 0.12);
      flex-shrink: 0;
    }

    .screenshot-container {
      position: relative;
      width: 100%;
      max-width: 700px;
    }

    .screenshot {
      width: 100%;
      border: 4px solid #171b22;
      box-shadow: 12px 12px 0 rgba(23, 27, 34, 0.12);
    }

    .screenshot-label {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      background: #edede7;
      border: 3px solid #ddab28;
      padding: 12px 32px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.1em;
      white-space: nowrap;
      box-shadow: 5px 5px 0 rgba(23, 27, 34, 0.1);
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="content">
    <div class="left">
      <div class="section-label">游戏介绍</div>

      <h2>
        致敬经典<br>
        <span class="highlight">generals.io</span>
      </h2>

      <p class="description">
        一个实时多人在线策略游戏，<br>
        重现经典玩法，加入创新特色
      </p>

      <div class="features">
        <div class="feature-item">
          <div class="feature-icon"></div>
          <span>实时多人对战，支持组队</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon"></div>
          <span>战争迷雾、将军、城市系统</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon"></div>
          <span>自定义地图编辑器</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon"></div>
          <span>游戏回放功能</span>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="screenshot-container">
        <img src="blockwar-pc.png" alt="BlockWar 游戏截图" class="screenshot">
        <div class="screenshot-label">桌面端游戏画面</div>
      </div>
    </div>
  </div>
</body>
</html>
