<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>BlockWar - 行动号召</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1920px;
      height: 1080px;
      background: #f7f7f2;
      color: #171b22;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      padding: 100px 120px;
      overflow: hidden;
      position: relative;
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      background-image:
        linear-gradient(rgba(221, 171, 40, 0.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(221, 171, 40, 0.2) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .section-label {
      font-size: 24px;
      color: #ddab28;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 50px;
    }

    h2 {
      font-size: 96px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 80px;
      text-shadow: 4px 4px 0 rgba(23, 27, 34, 0.08);
    }

    .cta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 50px;
      width: 100%;
      max-width: 1400px;
      margin-bottom: 80px;
    }

    .cta-card {
      background: #edede7;
      border: 4px solid rgba(23, 27, 34, 0.15);
      padding: 60px 50px;
      box-shadow: 10px 10px 0 rgba(23, 27, 34, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      transition: all 0.3s ease;
    }

    .cta-card:hover {
      border-color: #ddab28;
      transform: translate(-4px, -4px);
      box-shadow: 14px 14px 0 rgba(23, 27, 34, 0.15);
    }

    .cta-icon {
      font-size: 80px;
      line-height: 1;
    }

    .cta-title {
      font-size: 48px;
      font-weight: 900;
      color: #ddab28;
    }

    .cta-description {
      font-size: 28px;
      line-height: 1.6;
      color: #2d3440;
    }

    .cta-link {
      font-size: 32px;
      font-weight: 900;
      color: #171b22;
      background: rgba(221, 171, 40, 0.15);
      border: 3px solid #ddab28;
      padding: 16px 40px;
      box-shadow: 5px 5px 0 rgba(23, 27, 34, 0.1);
      font-family: 'Courier New', monospace;
      letter-spacing: 0.02em;
    }

    .feedback-banner {
      background: linear-gradient(135deg, #ddab28 0%, #c99820 100%);
      border: 4px solid #171b22;
      padding: 40px 60px;
      box-shadow: 10px 10px 0 rgba(23, 27, 34, 0.12);
      max-width: 1400px;
      width: 100%;
    }

    .feedback-text {
      font-size: 36px;
      font-weight: 900;
      color: #171b22;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="content">
    <div class="section-label">立即体验</div>

    <h2>来玩吧！</h2>

    <div class="cta-grid">
      <div class="cta-card">
        <div class="cta-icon">🎮</div>
        <div class="cta-title">试玩游戏</div>
        <div class="cta-description">
          访问官网，立即开始对战
        </div>
        <div class="cta-link">blockwar.01mvp.com</div>
      </div>

      <div class="cta-card">
        <div class="cta-icon">⭐</div>
        <div class="cta-title">GitHub Star</div>
        <div class="cta-description">
          查看源码，支持项目发展
        </div>
        <div class="cta-link">github.com/makerjackie/BlockWar</div>
      </div>

      <div class="cta-card">
        <div class="cta-icon">👥</div>
        <div class="cta-title">加入内测群</div>
        <div class="cta-description">
          与玩家交流，反馈建议
        </div>
        <div class="cta-link">QQ 群：374889821</div>
      </div>

      <div class="cta-card">
        <div class="cta-icon">💬</div>
        <div class="cta-title">反馈问题</div>
        <div class="cta-description">
          发现 Bug？有好点子？
        </div>
        <div class="cta-link">GitHub Issues</div>
      </div>
    </div>

    <div class="feedback-banner">
      <div class="feedback-text">
        你的反馈很重要！帮助我们让游戏变得更好 🚀
      </div>
    </div>
  </div>
</body>
</html>
