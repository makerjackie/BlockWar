<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>BlockWar - 特色亮点</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1920px;
      height: 1080px;
      background: #f7f7f2;
      color: #171b22;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      display: flex;
      padding: 100px 120px;
      overflow: hidden;
      position: relative;
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      background-image:
        linear-gradient(rgba(221, 171, 40, 0.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(221, 171, 40, 0.2) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      gap: 80px;
    }

    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section-label {
      font-size: 24px;
      color: #ddab28;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 40px;
      border-left: 6px solid #ddab28;
      padding-left: 24px;
    }

    h2 {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 60px;
      text-shadow: 3px 3px 0 rgba(23, 27, 34, 0.08);
    }

    .highlights {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .highlight-item {
      background: #edede7;
      border: 4px solid rgba(23, 27, 34, 0.12);
      border-left: 8px solid #ddab28;
      padding: 36px 40px;
      box-shadow: 6px 6px 0 rgba(23, 27, 34, 0.1);
    }

    .highlight-title {
      font-size: 36px;
      font-weight: 900;
      color: #ddab28;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .highlight-icon {
      font-size: 42px;
    }

    .highlight-description {
      font-size: 26px;
      line-height: 1.6;
      color: #2d3440;
    }

    .mobile-preview {
      position: relative;
      width: 100%;
      max-width: 500px;
    }

    .phone-frame {
      width: 100%;
      border: 6px solid #171b22;
      border-radius: 40px;
      box-shadow: 12px 12px 0 rgba(23, 27, 34, 0.12);
      overflow: hidden;
      background: #fff;
    }

    .phone-notch {
      height: 30px;
      background: #171b22;
      position: relative;
    }

    .phone-notch::after {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 14px;
      background: #000;
      border-radius: 10px;
    }

    .phone-screen {
      width: 100%;
      display: block;
    }

    .preview-label {
      position: absolute;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: #edede7;
      border: 3px solid #ddab28;
      padding: 12px 32px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.1em;
      white-space: nowrap;
      box-shadow: 5px 5px 0 rgba(23, 27, 34, 0.1);
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="content">
    <div class="left">
      <div class="section-label">特色亮点</div>
      <h2>创新与体验</h2>

      <div class="highlights">
        <div class="highlight-item">
          <div class="highlight-title">
            <span class="highlight-icon">📱</span>
            手机端触摸支持
          </div>
          <div class="highlight-description">
            完美适配移动设备，触摸操作流畅自然，随时随地开战
          </div>
        </div>

        <div class="highlight-item">
          <div class="highlight-title">
            <span class="highlight-icon">🏯</span>
            中文「战国」模式
          </div>
          <div class="highlight-description">
            特色游戏模式，融入中国战国时代元素，带来全新体验
          </div>
        </div>

        <div class="highlight-item">
          <div class="highlight-title">
            <span class="highlight-icon">🌐</span>
            中英双语界面
          </div>
          <div class="highlight-description">
            支持中英文切换，深色/浅色主题，满足不同玩家需求
          </div>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="mobile-preview">
        <div class="phone-frame">
          <div class="phone-notch"></div>
          <img src="blockwar-mobile.png" alt="移动端截图" class="phone-screen">
        </div>
        <div class="preview-label">移动端体验</div>
      </div>
    </div>
  </div>
</body>
</html>
