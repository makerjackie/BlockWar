<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>BlockWar - 结束页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1920px;
      height: 1080px;
      background: #f7f7f2;
      color: #171b22;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      background-image:
        linear-gradient(rgba(221, 171, 40, 0.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(221, 171, 40, 0.2) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 1400px;
    }

    .logo-container {
      margin-bottom: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
    }

    .logo-mark {
      width: 140px;
      height: 140px;
      background: #edede7;
      border: 4px solid #171b22;
      box-shadow: 8px 8px 0 rgba(23, 27, 34, 0.12);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      padding: 18px;
    }

    .logo-mark .cell {
      border: 3px solid #171b22;
    }

    .logo-mark .cell:nth-child(1) { background: #ddab28; }
    .logo-mark .cell:nth-child(2) { background: #fbfaf6; }
    .logo-mark .cell:nth-child(3) { background: #fbfaf6; }
    .logo-mark .cell:nth-child(4) { background: #171b22; }

    .title {
      font-size: 120px;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: #171b22;
      text-shadow: 4px 4px 0 rgba(23, 27, 34, 0.08);
      margin-bottom: 20px;
      line-height: 1;
    }

    .title-zh {
      font-size: 80px;
      letter-spacing: 0.08em;
      margin-top: 20px;
      color: #ddab28;
    }

    .tagline {
      font-size: 38px;
      color: #2d3440;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-top: 60px;
      line-height: 1.8;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 60px;
      margin-top: 80px;
    }

    .link-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .link-label {
      font-size: 24px;
      color: #667085;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .link-value {
      font-size: 32px;
      font-weight: 900;
      color: #171b22;
      background: #edede7;
      border: 3px solid #ddab28;
      padding: 16px 40px;
      box-shadow: 5px 5px 0 rgba(23, 27, 34, 0.1);
      font-family: 'Courier New', monospace;
    }

    .footer {
      margin-top: 100px;
      font-size: 28px;
      color: #8a91a0;
      font-weight: 600;
    }

    .footer-emoji {
      font-size: 36px;
      margin: 0 8px;
    }

    .decorative-blocks {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .block {
      position: absolute;
      background: #edede7;
      border: 3px solid rgba(23, 27, 34, 0.12);
      box-shadow: 4px 4px 0 rgba(23, 27, 34, 0.08);
    }

    .block-1 { width: 100px; height: 100px; top: 12%; left: 10%; opacity: 0.5; }
    .block-2 { width: 70px; height: 70px; top: 65%; left: 15%; opacity: 0.4; }
    .block-3 { width: 90px; height: 90px; top: 18%; right: 12%; opacity: 0.5; }
    .block-4 { width: 80px; height: 80px; bottom: 18%; right: 10%; opacity: 0.4; }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="decorative-blocks">
    <div class="block block-1"></div>
    <div class="block block-2"></div>
    <div class="block block-3"></div>
    <div class="block block-4"></div>
  </div>

  <div class="container">
    <div class="logo-container">
      <div class="logo-mark">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
    </div>

    <h1 class="title">BLOCKWAR</h1>
    <h1 class="title-zh">方块战争</h1>

    <p class="tagline">
      开源 · 免费 · AI 驱动<br>
      期待你的加入
    </p>

    <div class="links">
      <div class="link-item">
        <div class="link-label">官网</div>
        <div class="link-value">blockwar.01mvp.com</div>
      </div>

      <div class="link-item">
        <div class="link-label">GitHub</div>
        <div class="link-value">makerjackie/BlockWar</div>
      </div>

      <div class="link-item">
        <div class="link-label">QQ 群</div>
        <div class="link-value">374889821</div>
      </div>
    </div>

    <div class="footer">
      感谢观看 <span class="footer-emoji">🎮</span> 让我们一起创造更好的游戏体验
    </div>
  </div>
</body>
</html>
