<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>BlockWar - 封面</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1920px;
      height: 1080px;
      background: #f7f7f2;
      color: #171b22;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 方块网格背景 */
    .grid-bg {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      background-image:
        linear-gradient(rgba(221, 171, 40, 0.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(221, 171, 40, 0.2) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 1400px;
    }

    .logo-container {
      margin-bottom: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
    }

    .logo-mark {
      width: 160px;
      height: 160px;
      background: #edede7;
      border: 4px solid #171b22;
      box-shadow: 10px 10px 0 rgba(23, 27, 34, 0.15);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      padding: 20px;
    }

    .logo-mark .cell {
      border: 3px solid #171b22;
    }

    .logo-mark .cell:nth-child(1) { background: #ddab28; }
    .logo-mark .cell:nth-child(2) { background: #fbfaf6; }
    .logo-mark .cell:nth-child(3) { background: #fbfaf6; }
    .logo-mark .cell:nth-child(4) { background: #171b22; }

    .title {
      font-size: 140px;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: #171b22;
      text-shadow: 4px 4px 0 rgba(23, 27, 34, 0.1);
      margin-bottom: 20px;
      line-height: 1;
    }

    .title-zh {
      font-size: 96px;
      letter-spacing: 0.08em;
      margin-top: 30px;
      color: #ddab28;
    }

    .subtitle {
      font-size: 42px;
      color: #667085;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-top: 60px;
      line-height: 1.6;
    }

    .subtitle strong {
      color: #ddab28;
      font-weight: 900;
    }

    .badge {
      display: inline-block;
      background: #edede7;
      border: 3px solid #ddab28;
      padding: 16px 40px;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 80px;
      box-shadow: 6px 6px 0 rgba(23, 27, 34, 0.12);
    }

    .decorative-blocks {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .block {
      position: absolute;
      background: #edede7;
      border: 3px solid rgba(23, 27, 34, 0.15);
      box-shadow: 5px 5px 0 rgba(23, 27, 34, 0.08);
    }

    .block-1 { width: 120px; height: 120px; top: 10%; left: 8%; opacity: 0.6; }
    .block-2 { width: 80px; height: 80px; top: 70%; left: 12%; opacity: 0.5; }
    .block-3 { width: 100px; height: 100px; top: 15%; right: 10%; opacity: 0.6; }
    .block-4 { width: 90px; height: 90px; bottom: 15%; right: 8%; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="decorative-blocks">
    <div class="block block-1"></div>
    <div class="block block-2"></div>
    <div class="block block-3"></div>
    <div class="block block-4"></div>
  </div>

  <div class="container">
    <div class="logo-container">
      <div class="logo-mark">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
    </div>

    <h1 class="title">BLOCKWAR</h1>
    <h1 class="title-zh">方块战争</h1>

    <p class="subtitle">
      致敬 <strong>generals.io</strong> 的开源联机策略游戏<br>
      完全基于 Cloudflare 部署 · 运行成本几乎为 0
    </p>

    <div class="badge">Open Source</div>
  </div>
</body>
</html>
